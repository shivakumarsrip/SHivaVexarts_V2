[build]
  command = "npm run build:netlify"
  publish = "dist/public"
  functions = "dist/netlify-functions"

[functions]
  node_bundler = "none"

# Route API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback - serve index.html for all non-API, non-static routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
